name: Construire Horizon

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Installer les outils
        run: npm install

      - name: Adresse des liens de défi
        run: sed -i "s#/\*SHARE_BASE\*/#window.SHARE_BASE='https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/';#" www/index.html

      - name: Préparer le projet Android
        run: npm run android

      - name: Clé de signature (créée une seule fois, puis toujours la même)
        run: |
          mkdir -p ~/.android
          if [ ! -f resources/debug.keystore ]; then
            keytool -genkeypair -keystore resources/debug.keystore -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            git config user.name "horizon-bot"
            git config user.email "horizon-bot@users.noreply.github.com"
            git add resources/debug.keystore
            git commit -m "Clé de signature d'Horizon [skip ci]"
            git push
          fi
          cp resources/debug.keystore ~/.android/debug.keystore

      - name: Construire l'APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - name: Renommer
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Horizon.apk

      - name: Publier l'APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Horizon 1.0.${{ github.run_number }}
          body: Ouvre cette page sur ton téléphone Android, touche Horizon.apk puis installe-le.
          files: Horizon.apk

      - name: Préparer la version web
        uses: actions/upload-pages-artifact@v3
        with:
          path: www

  site:
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
    steps:
      - uses: actions/deploy-pages@v4
